name: 每日更新台股資料

on:
  schedule:
    # 台灣時間週一到週五 14:57（UTC 06:57）：收盤行情已公布，先更新價格與選股訊號
    - cron: "57 6 * * 1-5"
    # 台灣時間週一到週五 17:37（UTC 09:37）：補上當天的三大法人買賣超（約 15:30～16:30 公布）
    - cron: "37 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests

      - name: 同步最新資料
        # 排隊等待時，前一次執行可能已存入新資料；先同步，避免重複抓取與存檔衝突
        run: git pull --ff-only origin main

      - name: 抓取資料並計算訊號
        run: python scripts/update.py

      - name: 儲存原始資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
